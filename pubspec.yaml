name: restro_pro
description: Pro Restaurant POS with Stock + Receipt Printing
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_bluetooth_serial_plus: ^0.5.1
  esc_pos_utils: ^1.1.0
  pdf: ^3.11.3
  printing: ^5.12.2
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  share_plus: ^13.3.0

dependency_overrides:
  image: ^3.2.2

flutter:
  uses-material-design: true